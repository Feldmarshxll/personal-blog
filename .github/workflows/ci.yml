name: Site

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements/lock.txt
      - name: Test content pipeline
        run: python -m unittest discover -s tests -v
      - name: Build public site
        run: python -m tools.site_builder build
      - name: Check rendered links
        run: python -m tools.site_builder check

  deploy:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - run: python -m pip install -r requirements/lock.txt
      - run: python -m tools.site_builder build
      - name: Publish to the existing Pages branch
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .build/site
          publish_branch: gh-pages
          enable_jekyll: false
